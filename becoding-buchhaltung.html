
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE-Coding s.r.o. — Buchhaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="company">BE-CODING</div>
      <div class="app-name">s.r.o. · Buchhaltung</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Übersicht</div>
      <div class="nav-item active" data-tab="dashboard"><span class="icon">⊞</span> Dashboard</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Buchungen</div>
      <div class="nav-item" data-tab="income"><span class="icon">↑</span> Einnahmen</div>
      <div class="nav-item" data-tab="expenses"><span class="icon">↓</span> Ausgaben</div>
      <div class="nav-item" data-tab="transactions"><span class="icon">≡</span> Alle Buchungen</div>
      <div class="nav-item" data-tab="invoices"><span class="icon">⊟</span> Rechnungen</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Verwaltung</div>
      <div class="nav-item" data-tab="assets"><span class="icon">◈</span> Anlagevermögen</div>
      <div class="nav-item" data-tab="dividends"><span class="icon">◎</span> Dividenden</div>
      <div class="nav-item" data-tab="counterparties"><span class="icon">⬡</span> Geschäftspartner</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Steuern & Berichte</div>
      <div class="nav-item" data-tab="taxes"><span class="icon">%</span> Steuern</div>
      <div class="nav-item" data-tab="reports"><span class="icon">▤</span> Berichte</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">System</div>
      <div class="nav-item" data-tab="settings"><span class="icon">⚙</span> Einstellungen</div>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button id="sidebar-toggle" aria-label="Menü öffnen">☰</button>
        <div style="min-width:0">
          <div class="topbar-title" id="topbar-title">Dashboard</div>
          <div class="topbar-period" id="topbar-period"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="global-save-status" class="form-status" aria-live="polite"></span>
        <select id="year-switcher" onchange="UI.changeYear(this.value)" style="min-width:96px"></select>
        <button class="btn btn-ghost btn-sm" onclick="UI.exportJSON()">⬇ <span class="btn-label">JSON exportieren</span></button>
        <button class="btn btn-ghost btn-sm" onclick="UI.importJSON()">⬆ <span class="btn-label">JSON importieren</span></button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="sidebar-backdrop"></div>
<div id="auth-overlay"><main class="auth-screen"><section class="auth-card"><h1>BE-Coding Buchhaltung</h1><p class="muted">Anmeldung wird geprüft …</p></section></main></div>
<div id="modal-container"></div>
<div id="toast"></div>
<div id="print-root" style="display:none"></div>
<input type="file" id="file-input" accept=".json" style="display:none">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-config.local.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/draft-service.js"></script>
<script src="js/auth-service.js"></script>
<script src="js/persistence-service.js"></script>
<script src="js/attachment-service.js"></script>
<script src="js/migration-service.js?v=20261001-import2"></script>
<script src="js/ui-helper.js"></script>
<script src="js/tax-service.js"></script>
<script src="js/validation-service.js"></script>
<script src="js/invoice-service.js?v=20261001-version"></script>
<script src="js/invoice-scan-service.js"></script>
<script src="js/page-service.js?v=20261001-version"></script>
<script src="js/app-bootstrap.js"></script>
<script src="js/init.js?v=20261001-import"></script>
</body>
</html>
