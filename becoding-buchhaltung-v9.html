
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE-Coding s.r.o. — Buchhaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13;
    --surface: #16181f;
    --surface2: #1e2029;
    --border: #2a2d3a;
    --border2: #353848;
    --text: #e8eaf0;
    --text2: #8b8fa8;
    --text3: #5a5e72;
    --accent: #4fd1c5;
    --accent2: #38b2ac;
    --green: #48bb78;
    --red: #fc8181;
    --yellow: #f6c90e;
    --blue: #63b3ed;
    --purple: #b794f4;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
    line-height: 1.5;
  }

  #app { display: flex; height: 100vh; overflow: hidden; }

  #sidebar {
    width: 200px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .sidebar-logo {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .company { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: .08em; }
  .sidebar-logo .app-name { font-size: 10px; color: var(--text3); margin-top: 2px; }

  .sidebar-section { padding: 12px 8px 4px; }
  .sidebar-section-label { font-size: 9px; font-weight: 600; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; padding: 0 8px 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: var(--radius);
    cursor: pointer; color: var(--text2); font-size: 12px;
    transition: all .15s; margin-bottom: 1px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(79,209,197,.1); color: var(--accent); }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 48px;
  }
  .topbar-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-period { font-size: 11px; color: var(--text2); }
  .topbar-actions { display: flex; gap: 8px; align-items:center; }
  .topbar-year-wrap { display:flex; align-items:center; gap:8px; margin-right: 12px; }
  .topbar-year-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
  .topbar-year-select { width: 110px; min-width: 110px; }

  #content { flex: 1; overflow-y: auto; padding: 20px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius);
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border2); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: rgba(252,129,129,.1); }
  .btn-sm { padding: 4px 8px; font-size: 11px; }
  .btn-icon { padding: 5px 7px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card-title { font-size: 11px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .card-value { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--text); }
  .card-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .grid { display: grid; gap: 12px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    text-align: left; padding: 8px 10px;
    font-size: 10px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    white-space: nowrap;
  }
  td {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    color: var(--text); vertical-align: middle;
  }
  tr:hover td { background: rgba(255,255,255,.02); }
  .mono { font-family: var(--mono); }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  .blue { color: var(--blue); }
  .purple { color: var(--purple); }
  .muted { color: var(--text2); }

  .badge {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
  }
  .badge-green { background: rgba(72,187,120,.15); color: var(--green); }
  .badge-red { background: rgba(252,129,129,.15); color: var(--red); }
  .badge-yellow { background: rgba(246,201,14,.15); color: var(--yellow); }
  .badge-blue { background: rgba(99,179,237,.15); color: var(--blue); }
  .badge-gray { background: rgba(139,143,168,.15); color: var(--text2); }
  .badge-purple { background: rgba(183,148,244,.15); color: var(--purple); }

  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 7px 10px; color: var(--text);
    font-family: var(--sans); font-size: 12px;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { width: auto; }
  textarea { resize: vertical; min-height: 60px; }
  select option { background: var(--surface2); }

  .form-row { display: grid; gap: 12px; }
  .form-row-2 { grid-template-columns: 1fr 1fr; }
  .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal.modal-wide { max-width: 980px; }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-title { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .section-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters input, .filters select { width: auto; min-width: 130px; }

  .warning-bar {
    background: rgba(246,201,14,.08); border: 1px solid rgba(246,201,14,.2);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 12px; color: var(--yellow); margin-bottom: 14px;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .info-bar {
    background: rgba(99,179,237,.08); border: 1px solid rgba(99,179,237,.2);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 12px; color: var(--blue); margin-bottom: 14px;
  }

  .sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    padding: 8px 16px; cursor: pointer; font-size: 12px;
    color: var(--text2); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all .15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .tax-notice {
    font-size: 10px; color: var(--text3);
    border-left: 2px solid var(--border2);
    padding-left: 8px; margin-top: 8px; line-height: 1.4;
  }

  .config-badge {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border2);
    border-radius: 999px;
    font-size: 9px;
    color: var(--text3);
    margin-left: 4px;
  }
  .invoice-line-grid {
    display: grid;
    grid-template-columns: 70px minmax(240px,1fr) 90px 90px 120px 120px 44px;
    gap: 8px;
    align-items: end;
    margin-bottom: 8px;
  }
  .invoice-line-grid.invoice-line-head {
    margin-bottom: 10px;
    color: var(--text3);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .invoice-preview-shell {
    background: #e7e7e7;
    padding: 16px;
    border-radius: var(--radius);
  }

  .invoice-preview {
    background: #fff;
    color: #111;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 18mm 16mm 16mm;
    box-shadow: 0 6px 30px rgba(0,0,0,.16);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.25;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    position: relative;
    box-sizing: border-box;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .invoice-preview * { box-sizing: border-box; }

  .invoice-top-line {
    width: 76%;
    height: 3px;
    background: #111;
    margin: 0 0 18px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,.55), 0 2px 3px rgba(0,0,0,.18);
  }

  .invoice-topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 78px;
    width: calc(100% + 8px);
    margin-right: -8px;
  }

  .invoice-brand-title {
    font-size: 58px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: #b3b3b3;
    line-height: 1;
    margin-top: 2px;
  }

  .invoice-logo-wrap {
    text-align: right;
    min-width: 220px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    background: #fff;
    margin-left: auto;
  }

  .invoice-logo-wrap img {
    width: 200pxpx;
    max-width: 300px;
    max-height: 120px;
    margin-left: 50px;
    object-fit: contain;
    display: block;
    background: #fff;
    position: absolute;
    top: 50px;
  }

  .invoice-company-line {
    font-size: 11px;
    font-weight: 700;
    margin: 0 0 22px 8px;
  }

  .invoice-party-meta-row {
    display: grid;
    grid-template-columns: 1.35fr 0.95fr;
    gap: 34px;
    align-items: start;
    margin-bottom: 26px;
  }

  .invoice-party-block {
    padding-left: 8px;
  }

  .invoice-party-block .uid-line {
    margin-top: 10px;
  }

  .invoice-meta-right {
    padding-top: 2px;
  }

  .invoice-meta-table {
    width: 100%;
    border-collapse: collapse;
  }

  .invoice-meta-table td {
    padding: 0 0 14px 0 !important;
    vertical-align: top;
    font-size: 12px;
    color: #111 !important;
    border-bottom: none !important;
    background: transparent !important;
  }

  .invoice-meta-table td:first-child {
    width: 132px;
    font-weight: 700;
    white-space: nowrap;
    color: #111 !important;
  }

  .invoice-meta-table td:last-child {
    color: #111 !important;
    font-weight: 400;
  }

  .invoice-meta-right,
  .invoice-meta-right * {
    color: #111 !important;
  }

  .invoice-meta-date-right {
    text-align: right;
    font-size: 11px;
    margin-top: 42px;
  }

  .invoice-title-line {
    font-size: 20px;
    font-weight: 700;
    margin: 36px 0 2px 0;
  }

  .invoice-period {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 34px 0;
  }

  .invoice-body-text {
    margin-bottom: 18px;
    font-size: 12px;
  }

  .invoice-table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0 0px;
    table-layout: fixed;
  }

  .invoice-table col:nth-child(1) { width: 8%; }
  .invoice-table col:nth-child(2) { width: 48%; }
  .invoice-table col:nth-child(3) { width: 12%; }
  .invoice-table col:nth-child(4) { width: 15%; }
  .invoice-table col:nth-child(5) { width: 17%; }

  .invoice-table thead th {
    background: #000 !important;
    color: #fff !important;
    font-size: 12px;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    padding: 8px 8px;
    border: none !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .invoice-table thead th:nth-child(3){
    text-align: center;
  }

  .invoice-table thead th:nth-child(4),
  .invoice-table thead th:nth-child(5) {
    background: #bfbfbf !important;
    color: #111 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    text-align: right;
  }

  .invoice-table tbody td {
    background: transparent !important;
    color: #111 !important;
    border: none;
    padding: 4px 8px 2px;
    vertical-align: middle;
    font-size: 12px;
  }

  .invoice-table tbody td:nth-child(2),
  .invoice-table tbody td:nth-child(3),
  .invoice-table tbody td:nth-child(4),
  .invoice-table tbody td:nth-child(5) {
    font-size: 12px;
  }

  .invoice-table tbody td:nth-child(1),
  .invoice-table tbody td:nth-child(3),
  .invoice-table tbody td:nth-child(4),
  .invoice-table tbody td:nth-child(5) {
    white-space: nowrap;
  }

  .invoice-table tbody td:nth-child(3){
    text-align: center;
  }

  .invoice-table tbody td:nth-child(4),
  .invoice-table tbody td:nth-child(5){
    text-align: right;
  }

  .invoice-table-sep {
    border-top: 2px solid #111;
    margin-top: 2px;
  }

  .invoice-summary {
    width: 210px;
    margin-left: auto;
    margin-top: 3px;
  }

  .invoice-summary-row {
    display: grid;
    grid-template-columns: 1fr 105px;
    align-items: center;
    padding: 6px 4px;
    border-top: 1px solid #d4d4d4;
    font-size: 12px;
  }

  .invoice-summary-row:first-child {
    border-top: none;
  }

  .invoice-summary-row span:first-child {
    text-align: right;
    padding-right: 12px;
  }

  .invoice-summary-row span:last-child {
    text-align: right;
    font-weight: 700;
  }

  .invoice-summary-row:first-child span {
    font-weight: 700;
  }

  .invoice-summary-row.total {
    margin-top: 3px;
    background: #000 !important;
    color: #fff !important;
    border-top: none !important;
    font-size: 12px;
    font-weight: 700;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .invoice-payment-line {
    margin-top: 4px;
    font-size: 11px;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .invoice-tax-note {
    margin-top: 2px;
    font-size: 12px;
    font-style: italic;
    font-weight: 700;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .invoice-signoff {
    margin-top: 14px;
    font-size: 11px;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .invoice-footer {
    margin-top: 8px;
    font-size: 11px;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .invoice-footer-block {
    margin-top: 8px;
    font-size: 11px;
  }

  .invoice-footer-block .row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 10px;
    line-height: 1.15;
  }

  .invoice-bottom-line {
    margin-top: 12px;
    border-top: 3px solid #111;
    box-shadow: 0 1px 0 rgba(255,255,255,.55), 0 2px 3px rgba(0,0,0,.18);
    page-break-inside: avoid;
    break-inside: avoid;
  }

  @media print {
    body.print-mode { background:#fff !important; }
    body.print-mode #app,
    body.print-mode #toast,
    body.print-mode #modal-container,
    body.print-mode #file-input { display:none !important; }

    body.print-mode #print-root {
      display:block !important;
    }

    #print-root .invoice-preview-shell {
      padding: 0 !important;
      background: #fff !important;
    }

    #print-root .invoice-preview {
      box-shadow: none !important;
      margin: 0 !important;
      width: 210mm !important;
      min-height: 297mm !important;
      height: 297mm !important;
      padding: 16mm 16mm 12mm !important;
      background: #fff !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    #print-root .invoice-logo-wrap,
    #print-root .invoice-logo-wrap img {
      background: #fff !important;
    }

    #print-root .invoice-signoff {
      margin-top: 12px !important;
    }

    #print-root .invoice-footer {
      margin-top: 6px !important;
    }

    #print-root .invoice-footer-block {
      margin-top: 6px !important;
    }

    #print-root .invoice-bottom-line {
      margin-top: 8px !important;
    }

    #print-root .invoice-preview,
    #print-root .invoice-preview * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #print-root .invoice-table thead th {
      border: none !important;
    }

    #print-root .invoice-table thead th:nth-child(1),
    #print-root .invoice-table thead th:nth-child(2),
    #print-root .invoice-table thead th:nth-child(3) {
      background: #000 !important;
      color: #fff !important;
    }

    #print-root .invoice-table thead th:nth-child(4),
    #print-root .invoice-table thead th:nth-child(5) {
      background: #bfbfbf !important;
      color: #111 !important;
    }

    #print-root .invoice-summary-row.total,
    #print-root .invoice-summary-row.total span {
      background: #000 !important;
      color: #fff !important;
    }

    @page {
      size: A4;
      margin: 0;
    }
  }

  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

  #toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 2000;
    display: flex; flex-direction: column; gap: 6px;
  }
  .toast-msg {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 12px; color: var(--text); min-width: 220px;
    animation: slideIn .2s ease;
    display: flex; align-items: center; gap: 8px;
  }
  @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
  .empty .empty-icon { font-size: 32px; margin-bottom: 8px; }

  .amount-pos { color: var(--green); font-family: var(--mono); }
  .amount-neg { color: var(--red); font-family: var(--mono); }
  .amount-neutral { font-family: var(--mono); }

  .config-badge {
    display: inline-block; font-size: 9px; background: rgba(183,148,244,.15);
    color: var(--purple); border-radius: 3px; padding: 1px 5px;
    font-weight: 600; letter-spacing: .04em; margin-left: 6px;
  }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo">

  <div id="main">

        <select id="year-switcher" onchange="UI.changeYear(this.value)" style="min-width:96px"></select>
        <button class="btn btn-ghost btn-sm" onclick="UI.exportJSON()">⬇ JSON exportieren</button>
        <button class="btn btn-ghost btn-sm" onclick="UI.importJSON()">⬆ JSON importieren</button>

<div id="modal-container"></div>

<div id="print-root" style="display:none"></div>
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ============================================================
// MODUL: SCHEMA & STANDARDWERTE
// ============================================================
const SCHEMA_VERSION = '1.2.0';

const DEFAULT_VAT_RATES = [
  { id: 'vat23', label: '23% Standard',   rate: 0.23, active: true },
  { id: 'vat19', label: '19% Ermäßigt',   rate: 0.19, active: true },
  { id: 'vat5',  label: '5% Ermäßigt',    rate: 0.05, active: true },
  { id: 'vat0',  label: '0% (ohne USt.)', rate: 0.00, active: true },
];

const VAT_TREATMENTS = [
  { code: 'domestic_taxable_income',    label: 'Inländische steuerpflichtige Einnahme',      direction: 'income' },
  { code: 'domestic_taxable_expense',   label: 'Inländische steuerpflichtige Ausgabe',        direction: 'expense' },
  { code: 'vat_exempt',                 label: 'Steuerbefreit',                               direction: 'both' },
  { code: 'non_vat',                    label: 'Ohne USt. (außerhalb des Geltungsbereichs)',  direction: 'both' },
  { code: 'eu_b2b_rc_income',           label: 'EU B2B Reverse Charge – Einnahme',           direction: 'income' },
  { code: 'eu_b2b_rc_expense',          label: 'EU B2B Reverse Charge – Ausgabe',            direction: 'expense' },
  { code: 'third_country_income',       label: 'Drittland – Einnahme',                       direction: 'income' },
  { code: 'third_country_expense',      label: 'Drittland – Ausgabe',                        direction: 'expense' },
  { code: 'non_deductible_vat',         label: 'Nicht abzugsfähige Vorsteuer',               direction: 'expense' },
  { code: 'partially_deductible',       label: 'Teilweise abzugsfähige Vorsteuer*',          direction: 'expense', configurable: true },
];

const EXPENSE_CATEGORIES = [
  'Software & Lizenzen','Hardware & IT-Ausstattung','Büromiete','Telekommunikation',
  'Reise & Transport','Marketing & Werbung','Rechts- & Buchhaltungskosten','Subunternehmer',
  'Löhne & Sozialabgaben','Weiterbildung','Bankgebühren','Versicherung','Repräsentation','Sonstiges'
];

const INCOME_CATEGORIES = [
  'IT-Beratung','Softwareentwicklung','Lizenzen','Support & Wartung','Schulung','Sonstiges'
];

const DEFAULT_CIT_RULES = [
  { id: 'cit10', label: '10% (Einnahmen ≤ 100.000 EUR)', rate: 0.10, revenueUpTo: 100000 },
  { id: 'cit21', label: '21% (Einnahmen 100.001–5.000.000 EUR)', rate: 0.21, revenueUpTo: 5000000 },
  { id: 'cit24', label: '24% (Einnahmen > 5.000.000 EUR)', rate: 0.24, revenueUpTo: Infinity },
];

const DEFAULT_MIN_TAX = [
  { id: 'mt1', label: '340 EUR (Einnahmen ≤ 50.000)', revenueUpTo: 50000, amount: 340 },
  { id: 'mt2', label: '960 EUR (Einnahmen ≤ 250.000)', revenueUpTo: 250000, amount: 960 },
  { id: 'mt3', label: '1.920 EUR (Einnahmen ≤ 500.000)', revenueUpTo: 500000, amount: 1920 },
  { id: 'mt4', label: '3.840 EUR (Einnahmen > 500.000)', revenueUpTo: Infinity, amount: 3840 },
];

const FTT_RULES = {
  effectiveFrom: '2025-04-01',
  debitRate: 0.004,
  cashRate: 0.008,
  debitCapPerTx: 40,
  cashCapPerTx: null,
  cardAnnualFee: 2,
  businessCardCount: 0,
};

const DIVIDEND_DEFAULT_WHT = 0.10; // 10% – KONFIGURIERBAR


function defaultInvoiceSettings() {
  return {
    prefix: '',
    nextNumber: 1,
    resetYearly: false,
    dueDays: 15,
    defaultUnit: 'h',
    standardGreeting: 'Sehr geehrte Damen und Herren,',
    standardIntroText: 'vielen Dank für Ihr Vertrauen in meine Dienstleistung. Ich stelle Ihnen hiermit folgende Leistungen in Rechnung:',
    standardPaymentTerms: 'Zahlung innerhalb von 15 Tagen ab Rechnungseingang ohne Abzüge.',
    standardReverseChargeNote: 'Die Rechnungsausweis erfolgt ohne Umsatzsteuer, da die Steuerschuldnerschaft des Leistungsempfängers greift (Reverse-Charge-Verfahren).',
    standardVatNote: 'Es gilt die gesetzliche Umsatzsteuer.',
    standardClosingText: 'Mit freundlichen Grüßen',
    signatureName: 'Burak Elalmis',
    footerExtra: '',
    numberingFormat: 'plain',
  };
}
function addDays(dateString, days) {
  if (!dateString) return '';
  const d = new Date(dateString + 'T00:00:00');
  d.setDate(d.getDate() + (parseInt(days,10) || 0));
  return dateStr(d);
}
function moneyRound(n) { return Math.round((parseFloat(n) || 0) * 100) / 100; }
function formatQty(n) {
  const num = parseFloat(n || 0);
  if (Number.isInteger(num)) return String(num);
  return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function textToHtml(text) { return esc(text || '').replace(/\n/g, '<br>'); }
function getCounterpartyById(id) { return State.get().counterparties.find(c => c.id === id) || null; }
function getAvailableYears() {
  const s = State.get();
  const years = new Set();
  const current = Number(s.settings.accountingYear || new Date().getFullYear());
  for (let y=current-3; y<=current+3; y++) years.add(y);
  [...(s.transactions||[]), ...(s.invoicesIssued||[]), ...(s.invoicesReceived||[]), ...(s.dividends||[])].forEach(item => {
    const d = item.date || item.issueDate || item.paymentDate || item.resolutionDate;
    if (d && /^\d{4}/.test(String(d))) years.add(Number(String(d).slice(0,4)));
    if (item.profitYear) years.add(Number(item.profitYear));
  });
  return [...years].filter(Boolean).sort((a,b)=>b-a);
}
function setAccountingYear(year) {
  const y = parseInt(year, 10);
  if (!y) return;
  State.set(s => { s.settings.accountingYear = y; });
}
function attachmentsHtml(list=[]) {
  if (!list.length) return '';
  return `<div class="attachment-list">${list.map((att, idx)=>`<span class="attachment-chip">📎 ${esc(att.name || `Datei ${idx+1}`)}</span>`).join('')}</div>`;
}
function openAttachment(txId, idx) {
  const tx = State.get().transactions.find(t=>t.id===txId);
  const att = tx?.attachments?.[idx];
  if (!att?.dataUrl) return;
  const win = window.open();
  if (!win) return;
  win.document.write(`<title>${esc(att.name || 'Beleg')}</title><iframe src="${att.dataUrl}" style="border:0;width:100vw;height:100vh"></iframe>`);
  win.document.close();
}
window.openAttachment = openAttachment;

window.previewTransactionAttachments = function(txId) {
  const tx = State.get().transactions.find(t => t.id === txId);
  if (!tx || !Array.isArray(tx.attachments) || !tx.attachments.length) {
    showToast('Keine Anhänge vorhanden', 'warn');
    return;
  }
  const buttons = tx.attachments.map((att, idx) =>
    `<button class="btn btn-ghost btn-sm" onclick="openAttachmentByData(event, '${escAttr(att.dataUrl || '')}', '${escAttr(att.name || `Datei ${idx+1}`)}')">${esc(att.name || `Datei ${idx+1}`)}</button>`
  ).join('');
  const first = tx.attachments[0];
  const preview = (first.mimeType || '').includes('pdf')
    ? `<div style="background:#0b0c10;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:68vh;margin-top:12px"><iframe src="${first.dataUrl}" style="border:0;width:100%;height:100%"></iframe></div>`
    : `<div style="background:#0b0c10;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;display:flex;align-items:center;justify-content:center;min-height:68vh;margin-top:12px"><img src="${first.dataUrl}" alt="${escAttr(first.name || 'Anhang')}" style="max-width:100%;max-height:66vh;object-fit:contain"></div>`;
  openModal(`Belege – ${tx.description || 'Ausgabe'}`, `<div class="muted" style="margin-bottom:10px">Datei auswählen oder den ersten Beleg direkt in der Vorschau ansehen.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${buttons}</div>${preview}`, `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Schließen</button>`, 'wide');
};
function buildInvoiceNumber(previewYear=null) {
  const s = State.get();
  const cfg = s.settings.invoice || defaultInvoiceSettings();
  const year = String(previewYear || s.settings.accountingYear || new Date().getFullYear());
  const next = String(cfg.nextNumber || 1).padStart(4, '0');
  const prefix = cfg.prefix || '';
  const fmt = cfg.numberingFormat || 'plain';
  if (fmt === 'year-seq') return `${year}-${next}`;
  if (fmt === 'prefix-year-seq') return `${prefix || 'RE'}-${year}-${next}`;
  if (prefix) return `${prefix}${next}`;
  return next;
}
function invoiceTypeFromVatTreatment(vatTreatment) {
  if (vatTreatment === 'eu_b2b_rc_income') return 'reverse_charge';
  if (vatTreatment === 'vat_exempt') return 'vat_exempt';
  return 'standard';
}
function normalizeInvoice(raw, kind='issued', idx=0) {
  const s = State.get ? State.get() : null;
  const settings = s?.settings?.invoice || defaultInvoiceSettings();
  const company = s?.company || {};
  const cp = raw.counterpartyId && s ? getCounterpartyById(raw.counterpartyId) : null;
  const oldAmount = moneyRound(raw.amount || raw.grossAmount || 0);
  const lineItems = (raw.lineItems && raw.lineItems.length ? raw.lineItems : [{
    id: uid(),
    positionNumber: 1,
    description: raw.description || raw.vs || raw.notes || 'Leistung',
    quantity: 1,
    unit: settings.defaultUnit || 'h',
    unitPrice: oldAmount,
    vatRate: raw.vatRate || 0,
  }]).map((line, lineIdx) => {
    const quantity = parseFloat(line.quantity || 1) || 1;
    const unitPrice = moneyRound(line.unitPrice != null ? line.unitPrice : line.lineNetAmount || 0);
    const vatRate = parseFloat(line.vatRate || 0) || 0;
    const lineNetAmount = moneyRound(line.lineNetAmount != null ? line.lineNetAmount : quantity * unitPrice);
    const vatAmount = moneyRound(line.vatAmount != null ? line.vatAmount : lineNetAmount * vatRate);
    return {
      id: line.id || uid(),
      positionNumber: line.positionNumber || lineIdx + 1,
      description: line.description || 'Leistung',
      quantity,
      unit: line.unit || settings.defaultUnit || 'h',
      unitPrice,
      lineNetAmount,
      vatRate,
      vatAmount,
      lineGrossAmount: moneyRound(line.lineGrossAmount != null ? line.lineGrossAmount : lineNetAmount + vatAmount),
    };
  });
  const subtotalNet = moneyRound(lineItems.reduce((a, line) => a + line.lineNetAmount, 0));
  const totalVat = moneyRound(lineItems.reduce((a, line) => a + line.vatAmount, 0));
  const totalGross = moneyRound(lineItems.reduce((a, line) => a + line.lineGrossAmount, 0));
  const issueDate = raw.issueDate || raw.date || dateStr();
  const dueDate = raw.dueDate || addDays(issueDate, settings.dueDays || 15);
  const vatTreatment = raw.vatTreatment || (kind === 'issued' ? 'eu_b2b_rc_income' : 'domestic_taxable_expense');
  const invoiceType = raw.invoiceType || invoiceTypeFromVatTreatment(vatTreatment);
  const sender = {
    companyName: raw.senderSnapshot?.companyName || company.name || 'BE-Coding s.r.o.',
    addressLine: raw.senderSnapshot?.addressLine || company.address || '',
    zip: raw.senderSnapshot?.zip || company.zip || '',
    city: raw.senderSnapshot?.city || company.city || '',
    country: raw.senderSnapshot?.country || company.country || 'SK',
    ico: raw.senderSnapshot?.ico || company.ico || '',
    dic: raw.senderSnapshot?.dic || company.dic || '',
    icDph: raw.senderSnapshot?.icDph || company.icDph || '',
    iban: raw.senderSnapshot?.iban || company.bankIBAN || '',
    bic: raw.senderSnapshot?.bic || company.bankBIC || '',
    logoDataUrl: raw.senderSnapshot?.logoDataUrl || company.logoDataUrl || '',
  };
  const recipient = {
    customerName: raw.recipientSnapshot?.customerName || cp?.name || '',
    addressLine1: raw.recipientSnapshot?.addressLine1 || cp?.addressLine1 || cp?.address || '',
    addressLine2: raw.recipientSnapshot?.addressLine2 || cp?.addressLine2 || '',
    zip: raw.recipientSnapshot?.zip || cp?.zip || '',
    city: raw.recipientSnapshot?.city || cp?.city || '',
    country: raw.recipientSnapshot?.country || cp?.country || '',
    vatId: raw.recipientSnapshot?.vatId || cp?.vatNumber || '',
    taxNumber: raw.recipientSnapshot?.taxNumber || cp?.dic || '',
    registrationNumber: raw.recipientSnapshot?.registrationNumber || cp?.ico || '',
    contactPerson: raw.recipientSnapshot?.contactPerson || cp?.contactPerson || raw.contactPerson || '',
  };
  const taxNoteText = raw.taxNoteText || (invoiceType === 'reverse_charge' ? settings.standardReverseChargeNote : settings.standardVatNote);
  return {
    id: raw.id || uid(),
    number: raw.number || raw.invoiceNumber || `${String(idx + 1).padStart(4, '0')}`,
    invoiceNumber: raw.invoiceNumber || raw.number || `${String(idx + 1).padStart(4, '0')}`,
    invoiceType,
    issueDate,
    dueDate,
    servicePeriodFrom: raw.servicePeriodFrom || issueDate,
    servicePeriodTo: raw.servicePeriodTo || issueDate,
    currency: raw.currency || 'EUR',
    status: raw.status || 'draft',
    counterpartyId: raw.counterpartyId || '',
    contactPerson: raw.contactPerson || recipient.contactPerson || '',
    introText: raw.introText || settings.standardIntroText,
    paymentTermsText: raw.paymentTermsText || settings.standardPaymentTerms,
    taxNoteText,
    closingText: raw.closingText || settings.standardClosingText,
    internalNote: raw.internalNote || raw.notes || '',
    senderSnapshot: sender,
    recipientSnapshot: recipient,
    lineItems,
    subtotalNet,
    totalVat,
    totalGross,
    amount: totalGross,
    vatTreatment,
    reverseCharge: raw.reverseCharge != null ? !!raw.reverseCharge : invoiceType === 'reverse_charge',
    vatExempt: raw.vatExempt != null ? !!raw.vatExempt : invoiceType === 'vat_exempt',
    documentMeta: {
      createdAt: raw.documentMeta?.createdAt || raw.createdAt || now(),
      updatedAt: raw.documentMeta?.updatedAt || raw.updatedAt || now(),
      pdfFileNameSuggestion: raw.documentMeta?.pdfFileNameSuggestion || `Rechnung_${raw.number || raw.invoiceNumber || String(idx+1).padStart(4, '0')}.pdf`,
      lockedPdfSnapshot: raw.documentMeta?.lockedPdfSnapshot || null,
    },
    linkedTransactionId: raw.linkedTransactionId || null,
    createdAt: raw.createdAt || now(),
    updatedAt: raw.updatedAt || now(),
  };
}
function invoiceStatusBadge(status) {
  const map = { draft:'<span class="badge badge-gray">Entwurf</span>', unpaid:'<span class="badge badge-yellow">Offen</span>', paid:'<span class="badge badge-green">Bezahlt</span>', partial:'<span class="badge badge-blue">Teilbezahlt</span>', cancelled:'<span class="badge badge-red">Storniert</span>' };
  return map[status] || '<span class="badge badge-gray">–</span>';
}
function invoiceTaxLabel(inv) {
  if (inv.reverseCharge) return 'Reverse Charge';
  if (inv.vatExempt) return 'USt.-frei';
  if ((inv.totalVat || 0) > 0) return 'mit USt.';
  return 'ohne USt.';
}

function getIssuedInvoiceIncomeRows(year) {
  const s = State.get();
  const invoices = (s.invoicesIssued || []).filter(i => i.issueDate && i.issueDate.startsWith(String(year)));
  const linkedTxIds = new Set(invoices.map(i => i.linkedTransactionId).filter(Boolean));
  const invoiceRows = invoices.map(inv => {
    const tx = (s.transactions || []).find(t => t.id === inv.linkedTransactionId || t.invoiceRef === inv.number);
    return {
      id: inv.id,
      rowType: 'invoice',
      date: inv.issueDate,
      number: inv.number,
      description: inv.lineItems?.[0]?.description || `Rechnung ${inv.number}`,
      counterpartyId: inv.counterpartyId,
      category: tx?.category || 'Rechnungsumsatz',
      netAmount: inv.subtotalNet || 0,
      vatAmount: inv.totalVat || 0,
      grossAmount: inv.totalGross || 0,
      paymentStatus: inv.status === 'paid' ? 'paid' : (inv.status === 'partial' ? 'partial' : 'unpaid'),
      vatTreatment: inv.vatTreatment || '',
      linkedTransactionId: tx?.id || null,
      attachments: [],
    };
  });
  const manualRows = (s.transactions || []).filter(t =>
    t.type === 'income' &&
    t.date &&
    t.date.startsWith(String(year)) &&
    !linkedTxIds.has(t.id) &&
    !(t.invoiceRef && invoices.some(inv => inv.number === t.invoiceRef))
  ).map(t => ({ ...t, rowType: 'manual', number: t.invoiceRef || '–' }));
  return [...invoiceRows, ...manualRows].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
}

function syncIssuedInvoicesToIncomeTransactions() {
  State.set(s => {
    (s.invoicesIssued || []).forEach(inv => {
      const existingIdx = s.transactions.findIndex(t => t.id === inv.linkedTransactionId || t.invoiceRef === inv.number);
      const txId = existingIdx >= 0 ? s.transactions[existingIdx].id : (inv.linkedTransactionId || uid());
      const txData = {
        id: txId,
        date: inv.issueDate,
        type: 'income',
        category: s.transactions[existingIdx]?.category || 'Rechnungsumsatz',
        description: (inv.lineItems?.[0]?.description || `Rechnung ${inv.number}`).slice(0, 200),
        counterpartyId: inv.counterpartyId,
        netAmount: inv.subtotalNet || 0,
        vatRate: inv.subtotalNet ? ((inv.totalVat || 0) / inv.subtotalNet) : 0,
        vatAmount: inv.totalVat || 0,
        grossAmount: inv.totalGross || 0,
        vatTreatment: inv.vatTreatment || 'eu_b2b_rc_income',
        paymentStatus: inv.status === 'paid' ? 'paid' : (inv.status === 'partial' ? 'partial' : 'unpaid'),
        invoiceRef: inv.number,
        createdAt: s.transactions[existingIdx]?.createdAt || now(),
        updatedAt: now(),
        deductible: true,
        currency: inv.currency || 'EUR',
        attachments: s.transactions[existingIdx]?.attachments || []
      };
      inv.linkedTransactionId = txId;
      if (existingIdx >= 0) s.transactions[existingIdx] = { ...s.transactions[existingIdx], ...txData };
      else s.transactions.push(txData);
    });
  });
}
function generateInvoiceDocument(inv) {
  const cfg = State.get().settings.invoice || defaultInvoiceSettings();
  const sender = inv.senderSnapshot || {};
  const recipient = inv.recipientSnapshot || {};

  const senderLine = [
    sender.companyName || '',
    sender.addressLine || '',
    [sender.zip, sender.city].filter(Boolean).join(' ')
  ].filter(Boolean).join(' - ');

  const recipientLines = [
    recipient.customerName || '',
    recipient.addressLine1 || '',
    recipient.addressLine2 || '',
    [recipient.zip, recipient.city].filter(Boolean).join(' '),
    recipient.country === 'DE' ? 'Deutschland' : (recipient.country || '')
  ].filter(Boolean);

  const lineRows = (inv.lineItems || []).map(line => `
    <tr>
      <td>${esc(String(line.positionNumber || ''))}.</td>
      <td>${textToHtml(line.description || '')}</td>
      <td>${esc(formatQty(line.quantity))} ${esc(line.unit || '')}</td>
      <td>${fmtMoney(line.unitPrice)}</td>
      <td>${fmtMoney(line.lineNetAmount)}</td>
    </tr>
  `).join('');

  const issueDate = fmtDate(inv.issueDate);
  const issueDateDisplay = issueDate !== '–'
          ? `${issueDate.slice(8,10)}.${issueDate.slice(5,7)}.${issueDate.slice(0,4)}`
          : '–';

  const serviceFrom = fmtDate(inv.servicePeriodFrom);
  const serviceTo = fmtDate(inv.servicePeriodTo);

  const serviceFromDisplay = serviceFrom !== '–'
          ? `${serviceFrom.slice(8,10)}.${serviceFrom.slice(5,7)}.${serviceFrom.slice(0,4)}`
          : '–';

  const serviceToDisplay = serviceTo !== '–'
          ? `${serviceTo.slice(8,10)}.${serviceTo.slice(5,7)}.${serviceTo.slice(0,4)}`
          : '–';

  const reverseChargeNote = inv.taxNoteText
          ? textToHtml(inv.taxNoteText)
          : '';

  return `
  <div class="invoice-preview-shell">
    <div class="invoice-preview">
      <div class="invoice-top-line"></div>

      <div class="invoice-topbar">
        <div class="invoice-brand-title">RECHNUNG</div>
        <div class="invoice-logo-wrap">
          ${
          sender.logoDataUrl
                  ? `<img src="${sender.logoDataUrl}" alt="Logo">`
                  : `<div style="font-size:24px;font-weight:700;letter-spacing:.18em;">BE-CODING</div>`
  }
        </div>
      </div>

      <div class="invoice-company-line">${esc(senderLine)}</div>

      <div class="invoice-party-meta-row">
        <div class="invoice-party-block">
          ${recipientLines.map(line => `<div>${esc(line)}</div>`).join('')}
          ${recipient.vatId ? `<div class="uid-line">UID: ${esc(recipient.vatId)}</div>` : ''}
        </div>

        <div class="invoice-meta-right">
          <table class="invoice-meta-table">
            <tr>
              <td>Rechnung Nr.:</td>
              <td>${esc(inv.number || '')}</td>
            </tr>
            <tr>
              <td>Rechnungsdatum:</td>
              <td>${esc(issueDateDisplay)}</td>
            </tr>
            <tr>
              <td>Ansprechpartner:</td>
              <td>${textToHtml((inv.contactPerson || '').replace(/\s+/g, ' ').trim()).replace(' ', '<br>')}</td>
            </tr>
          </table>
          <div class="invoice-meta-date-right">${esc(issueDateDisplay)}</div>

function yearsWithData() {

const Tax = (() => {
  function vatSummary(transactions, year, quarter) {
    let outputVat = 0, inputVat = 0, rcBase = 0;
    const filtered = transactions.filter(t => {
      if (!t.date) return false;
      const yr = t.date.slice(0,4); const q = Math.ceil(parseInt(t.date.slice(5,7))/3);
      if (year && yr !== String(year)) return false;
      if (quarter && q !== quarter) return false;
      return true;
    });
    for (const t of filtered) {
      if (t.type === 'income' && t.vatTreatment === 'domestic_taxable_income') outputVat += (t.vatAmount || 0);
      if (t.type === 'expense' && ['domestic_taxable_expense'].includes(t.vatTreatment)) inputVat += (t.vatAmount || 0);
      if (['eu_b2b_rc_expense','eu_b2b_rc_income'].includes(t.vatTreatment)) rcBase += (t.netAmount || 0);
    }
    return { outputVat, inputVat, balance: outputVat - inputVat, rcBase };
  }

  function citEstimate(transactions, year) {
    const state = State.get();
    const txYear = transactions.filter(t => t.date && t.date.startsWith(String(year)));
    const revenue = txYear.filter(t=>t.type==='income').reduce((s,t)=>s+(t.netAmount||0),0);
    const expenses = txYear.filter(t=>t.type==='expense'&&t.deductible!==false).reduce((s,t)=>s+(t.grossAmount||0),0);
    const profit = revenue - expenses;
    const taxBase = Math.max(0, profit);
    const rules = state.settings.citRules || DEFAULT_CIT_RULES;
    let rate = 0.21;
    for (const r of rules) { if (revenue <= r.revenueUpTo) { rate = r.rate; break; } }
    const citEstimated = taxBase * rate;
    const minRules = state.settings.minTaxRules || DEFAULT_MIN_TAX;
    let minTax = 340;
    for (const r of minRules) { if (revenue <= r.revenueUpTo) { minTax = r.amount; break; } }
    const taxPayable = Math.max(citEstimated, minTax);
    return { revenue, expenses, profit, taxBase, rate, citEstimated, minTax, taxPayable };
  }

  function classifyFttTransaction(t, rules) {
    if (!t?.date || !rules) return { bucket: 'ignored', taxableAmount: 0, tax: 0, label: 'Nicht berücksichtigt' };
    if (rules.effectiveFrom && t.date < rules.effectiveFrom) return { bucket: 'ignored', taxableAmount: 0, tax: 0, label: 'Vor Wirksamkeit' };
    const amount = Math.abs(parseFloat(t.grossAmount || 0));
    if (!amount) return { bucket: 'ignored', taxableAmount: 0, tax: 0, label: 'Ohne Betrag' };

    if (t.fttType === 'exempt') return { bucket: 'exempt', taxableAmount: 0, tax: 0, label: 'Befreit' };
    if (t.fttType === 'internal') return { bucket: 'internal', taxableAmount: 0, tax: 0, label: 'Interne Überweisung' };
    if (t.fttType === 'card') return { bucket: 'card', taxableAmount: 0, tax: 0, label: 'Kartenzahlung / Jahresgebühr separat' };

    if (t.fttType === 'cash') {
      const tax = moneyRound(amount * (rules.cashRate || 0));
      return { bucket: 'cash', taxableAmount: amount, tax, label: 'Barabhebung' };
    }

    const isOutgoing = t.type === 'expense';
    const shouldTaxAsDebit = t.fttType === 'debit' || (!t.fttType && isOutgoing);
    if (shouldTaxAsDebit) {
      const cap = rules.debitCapPerTx == null ? Infinity : rules.debitCapPerTx;
      const tax = moneyRound(Math.min(amount * (rules.debitRate || 0), cap));
      return { bucket: t.fttType === 'debit' ? 'debit_manual' : 'debit_auto', taxableAmount: amount, tax, label: t.fttType === 'debit' ? 'Belastung manuell' : 'Belastung automatisch' };
    }

    return { bucket: 'ignored', taxableAmount: 0, tax: 0, label: 'Nicht steuerpflichtig' };
  }

  function fttSummary(transactions, year) {
    const rules = { ...FTT_RULES, ...(State.get().settings.fttRules || {}) };
    const txYear = transactions.filter(t=>t.date&&t.date.startsWith(String(year)));
    let debitTax = 0, cashTax = 0, autoDebitTax = 0, manualDebitTax = 0;
    let taxableDebitBase = 0, taxableCashBase = 0;
    let exemptCount = 0, internalCount = 0, ignoredCount = 0;

    const details = txYear.map(t => {
      const item = classifyFttTransaction(t, rules);
      if (item.bucket === 'debit_auto' || item.bucket === 'debit_manual') {
        debitTax += item.tax;
        taxableDebitBase += item.taxableAmount;
        if (item.bucket === 'debit_auto') autoDebitTax += item.tax;
        else manualDebitTax += item.tax;
      } else if (item.bucket === 'cash') {
        cashTax += item.tax;
        taxableCashBase += item.taxableAmount;
      } else if (item.bucket === 'exempt') exemptCount += 1;
      else if (item.bucket === 'internal') internalCount += 1;
      else ignoredCount += 1;
      return { ...t, fttComputed: item };
    });

    const cardFee = moneyRound((parseInt(rules.businessCardCount || 0, 10) || 0) * (rules.cardAnnualFee || 0));
    return {
      rules,
      details,
      debitTax: moneyRound(debitTax),
      cashTax: moneyRound(cashTax),
      autoDebitTax: moneyRound(autoDebitTax),
      manualDebitTax: moneyRound(manualDebitTax),
      taxableDebitBase: moneyRound(taxableDebitBase),
      taxableCashBase: moneyRound(taxableCashBase),
      cardFee,
      exemptCount,
      internalCount,
      ignoredCount,
      total: moneyRound(debitTax + cashTax + cardFee)
    };
  }

  function calcVatAmounts(net, rate) {
    const vat = Math.round(net * rate * 100) / 100;
    return { netAmount: net, vatRate: rate, vatAmount: vat, grossAmount: net + vat };
  }

  function assetDepreciation(asset) {
    const cost = asset.acquisitionCost || 0;
    const years = asset.depreciationYears || 1;
    return { annual: cost / years, monthly: cost / years / 12, totalYears: years };
  }

  return { vatSummary, citEstimate, fttSummary, classifyFttTransaction, calcVatAmounts, assetDepreciation };
})();

const Validate = (() => {
  function transaction(t) {
    const errors = [];
    if (!t.date) errors.push('Datum ist erforderlich');
    if (!t.type) errors.push('Buchungstyp ist erforderlich');
    if (!t.description || !t.description.trim()) errors.push('Beschreibung ist erforderlich');
    if (!t.netAmount || isNaN(t.netAmount) || t.netAmount <= 0) errors.push('Betrag muss eine positive Zahl sein');
    if (!t.vatTreatment) errors.push('Steuerliche Einordnung ist erforderlich');
    if (!t.category) errors.push('Kategorie ist erforderlich');
    if (t.vatRate > 0) {
      const expectedVat = Math.round(t.netAmount * t.vatRate * 100) / 100;
      if (Math.abs((t.vatAmount||0) - expectedVat) > 0.02) errors.push('USt.-Betrag stimmt nicht mit dem Steuersatz überein');
    }
    return errors;
  }

  function invoice(inv) {
    const errors = [];
    if (!inv.number || !String(inv.number).trim()) errors.push('Rechnungsnummer ist erforderlich');
    if (!inv.counterpartyId) errors.push('Geschäftspartner ist erforderlich');
    if (!inv.recipientSnapshot?.customerName) errors.push('Empfängername fehlt');
    if (!inv.recipientSnapshot?.addressLine1) errors.push('Empfängeradresse fehlt');
    if (!inv.issueDate) errors.push('Ausstellungsdatum ist erforderlich');
    if (!inv.dueDate) errors.push('Fälligkeitsdatum ist erforderlich');
    const lines = inv.lineItems || [];
    if (!lines.length) errors.push('Mindestens eine Rechnungsposition ist erforderlich');
    lines.forEach((line, idx) => {
      if (!line.description || !String(line.description).trim()) errors.push(`Beschreibung in Position ${idx+1} fehlt`);
      if (!(parseFloat(line.quantity) > 0)) errors.push(`Menge in Position ${idx+1} muss größer als 0 sein`);
      if (!(parseFloat(line.unitPrice) >= 0)) errors.push(`Einheitspreis in Position ${idx+1} ist ungültig`);
    });
    if (Math.abs(moneyRound((inv.subtotalNet||0) + (inv.totalVat||0)) - moneyRound(inv.totalGross||0)) > 0.02) errors.push('Summen der Rechnung sind inkonsistent');
    if (inv.reverseCharge && Math.abs(inv.totalVat || 0) > 0.02) errors.push('Reverse-Charge-Rechnungen dürfen keine USt. ausweisen');
    return errors;
  }

  function asset(a) {
    const errors = [];
    if (!a.name || !a.name.trim()) errors.push('Bezeichnung des Wirtschaftsguts ist erforderlich');
    if (!a.purchaseDate) errors.push('Anschaffungsdatum ist erforderlich');
    if (!a.acquisitionCost || isNaN(a.acquisitionCost) || a.acquisitionCost <= 0) errors.push('Anschaffungskosten sind erforderlich');
    if (!a.depreciationYears || a.depreciationYears < 1) errors.push('Nutzungsdauer muss mindestens 1 Jahr betragen');
    return errors;
  }

  return { transaction, invoice, asset };
})();

function showToast(msg, type='info') {
  const icons = { info:'ℹ', success:'✓', error:'✕', warn:'⚠' };
  const colors = { info: 'var(--blue)', success: 'var(--green)', error: 'var(--red)', warn: 'var(--yellow)' };
  const t = document.createElement('div'); t.className = 'toast-msg';
  t.innerHTML = `<span style="color:${colors[type]}">${icons[type]}</span> ${esc(msg)}`;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openModal(titleText, bodyHTML, footerHTML='', size='default') {
  const container = document.getElementById('modal-container');
  container.innerHTML = `
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${size==='wide' ? 'modal-wide' : ''}">
        <div class="modal-header">
          <div class="modal-title">${esc(titleText)}</div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function confirm(msg, onYes) {
  openModal('Bestätigen', `<p style="color:var(--text)">${esc(msg)}</p>`,
    `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Abbrechen</button>
     <button class="btn btn-danger btn-sm" onclick="closeModal();(${onYes.toString()})()">Bestätigen</button>`);
}

function vatTreatmentOptions(dir='both') {
  return VAT_TREATMENTS
    .filter(v => v.direction === dir || v.direction === 'both')
    .map(v => `<option value="${v.code}">${v.label}${v.configurable?' *':''}</option>`).join('');
}
function vatRateOptions() {
  const s = State.get();
  return (s.settings.vatRates||DEFAULT_VAT_RATES).map(r=>`<option value="${r.rate}">${r.label}</option>`).join('');
}
function counterpartyOptions(type=null) {
  const s = State.get();
  const list = type ? s.counterparties.filter(c=>c.type===type||c.type==='both') : s.counterparties;
  return ['<option value="">– Geschäftspartner –</option>', ...list.map(c=>`<option value="${c.id}">${esc(c.name)}${c.city ? ' · ' + esc(c.city) : ''}</option>`)].join('');

function cpName(id) {
  const s = State.get(); const c = s.counterparties.find(x=>x.id===id);

function categoryOptions(type) {
  const cats = type==='income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  return cats.map(c=>`<option value="${c}">${c}</option>`).join('');

window.txFormTypeChange = function() {
  const type = document.getElementById('f-type')?.value;
  const catEl = document.getElementById('f-category');
  const vatEl = document.getElementById('f-vattr');
  if (catEl) catEl.innerHTML = categoryOptions(type);
  if (vatEl) vatEl.innerHTML = vatTreatmentOptions(type==='income'?'income':'expense');
};
window.txFormCalcVat = function() {
  const net = parseFloat(document.getElementById('f-net')?.value)||0;
  const rate = parseFloat(document.getElementById('f-vatrate')?.value)||0;
  const vat = Math.round(net*rate*100)/100;
  const vatEl = document.getElementById('f-vat');
  if (vatEl) vatEl.value = vat.toFixed(2);
};

function renderTxAttachmentEditor() {
  const target = document.getElementById('f-attachment-list');
  if (!target) return;
  const attachments = Array.isArray(window._editingTxAttachments) ? window._editingTxAttachments : [];
  target.innerHTML = attachments.length
    ? attachments.map((att, i) => `
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
        <span class="badge badge-gray">${getAttachmentIcon(att)}</span>
        <a href="#" onclick="openAttachmentByData(event, '${escAttr(att.dataUrl || '')}', '${escAttr(att.name || 'Datei')}')" style="color:var(--text2);text-decoration:none">${esc(att.name || `Anhang ${i+1}`)}</a>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="removeTxAttachment(${i})">✕</button>
      </div>`).join('')
    : '<span class="muted">Keine Anhänge</span>';
}

async function bindTxAttachmentEvents(existing) {
  window._editingTxAttachments = Array.isArray(existing?.attachments) ? [...existing.attachments] : [];
  renderTxAttachmentEditor();
  const input = document.getElementById('f-attachments');
  if (!input) return;
  input.onchange = async e => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      const dataUrl = await readFileAsDataUrl(file);
      window._editingTxAttachments.push({
        id: uid(),
        name: file.name,
        mimeType: file.type || 'application/octet-stream',
        size: file.size || 0,
        dataUrl,
        uploadedAt: now()
      });
    }
    renderTxAttachmentEditor();
    e.target.value = '';
  };
}

async function readTxForm(existingId) {
  const existing = existingId ? State.get().transactions.find(t => t.id === existingId) : null;
  const net = parseFloat(document.getElementById('f-net').value)||0;
  const rate = parseFloat(document.getElementById('f-vatrate').value)||0;
  const vat = Math.round(net*rate*100)/100;
  return {
    id: existingId || uid(),
    date: document.getElementById('f-date').value,
    type: document.getElementById('f-type').value,
    category: document.getElementById('f-category').value,
    description: document.getElementById('f-desc').value,
    counterpartyId: document.getElementById('f-cp').value||null,
    invoiceRef: document.getElementById('f-ref').value,
    netAmount: net,
    vatRate: rate,
    vatAmount: vat,
    grossAmount: net+vat,
    vatTreatment: document.getElementById('f-vattr').value,
    paymentStatus: document.getElementById('f-pay').value,
    fttType: document.getElementById('f-ftt').value||null,
    deductible: document.getElementById('f-deduct').checked,
    notes: document.getElementById('f-note').value,
    attachments: Array.isArray(window._editingTxAttachments) ? [...window._editingTxAttachments] : [],
    currency: 'EUR',
    updatedAt: now(),
    createdAt: existing?.createdAt || now(),
  };
}

function openTxModal(existingId) {
  const s = State.get();
  const existing = existingId ? s.transactions.find(t=>t.id===existingId) : null;
  window._editingTxAttachments = Array.isArray(existing?.attachments) ? [...existing.attachments] : [];
  const title = existing ? 'Buchung bearbeiten' : 'Neue Buchung';
  openModal(title, txFormHTML(existing||{}, 'income'),
    `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Abbrechen</button>
     <button class="btn btn-primary btn-sm" onclick="saveTx(${existingId?`'${existingId}'`:'null'})">Speichern</button>`);
  setTimeout(()=>{
    if (existing) {
      const catEl=document.getElementById('f-category'); if(catEl)catEl.value=existing.category||'';
      const vatEl=document.getElementById('f-vatrate'); if(vatEl)vatEl.value=existing.vatRate||0;
      const vattr=document.getElementById('f-vattr'); if(vattr)vattr.value=existing.vatTreatment||'';
      const cpEl=document.getElementById('f-cp'); if(cpEl)cpEl.value=existing.counterpartyId||'';
    }
    bindTxAttachmentEvents(existing);
  },30);
}
window.openTxModal = openTxModal;

window.openAttachmentByData = function(event, dataUrl, name='Anhang') {
  if (event) event.preventDefault();
  const title = esc(name || 'Anhang');
  const isPdf = (dataUrl || '').startsWith('data:application/pdf');
  const body = isPdf
    ? `<div style="background:#0b0c10;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:72vh"><iframe src="${dataUrl}" style="border:0;width:100%;height:100%"></iframe></div>`
    : `<div style="background:#0b0c10;border:1px solid var(--border);border-radius:var(--radius);overflow:auto;display:flex;align-items:center;justify-content:center;min-height:72vh"><img src="${dataUrl}" alt="${escAttr(name)}" style="max-width:100%;max-height:70vh;object-fit:contain"></div>`;
  openModal(title, body, `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Schließen</button><button class="btn btn-primary btn-sm" onclick="downloadAttachment('${escAttr(dataUrl)}','${escAttr(name)}')">Neu öffnen</button>`, 'wide');
};
window.downloadAttachment = function(dataUrl, name='Anhang') {
  const w = window.open('about:blank', '_blank');
  if (!w) return;
  if ((dataUrl || '').startsWith('data:application/pdf')) {
    w.document.write(`<title>${escAttr(name)}</title><iframe src="${dataUrl}" style="border:0;width:100vw;height:100vh"></iframe>`);
  } else {
    w.document.write(`<title>${escAttr(name)}</title><div style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${dataUrl}" alt="${escAttr(name)}" style="max-width:98vw;max-height:98vh"></div>`);
  }
  w.document.close();
};
window.removeTxAttachment = function(idx) {
  if (!Array.isArray(window._editingTxAttachments)) return;
  window._editingTxAttachments.splice(idx, 1);
  renderTxAttachmentEditor();
};

window.saveTx = async function(existingId) {
  const t = await readTxForm(existingId);
  const errors = Validate.transaction(t);
  if (errors.length) { showToast(errors[0], 'error'); return; }
  State.set(s => {
    if (existingId) {
      const i = s.transactions.findIndex(x=>x.id===existingId);
      if (i>=0) { t.createdAt = s.transactions[i].createdAt; s.transactions[i]=t; }
    } else {
      s.transactions.push(t);
    }
  });
  closeModal(); window._editingTxAttachments = []; showToast('Buchung gespeichert', 'success');
  UI.render(UI.currentTab);
};

window.deleteTx = function(id) {
  confirm('Diese Buchung wirklich löschen?', ()=>{
    State.set(s=>{ s.transactions = s.transactions.filter(t=>t.id!==id); });
    showToast('Buchung gelöscht', 'warn'); UI.render(UI.currentTab);
  });
};

// ── AUSGABEN ───────────────────────────────────────────────

// ── ALLE BUCHUNGEN ─────────────────────────────────────────
Pages.transactions = function(opts={}) {
  const s = State.get(); const yr = s.settings.accountingYear;
  let txns = s.transactions.filter(t=>t.date&&t.date.startsWith(String(yr)));
  const search = opts.search||''; const typeF = opts.type||''; const catF = opts.cat||'';
  if (search) txns = txns.filter(t=>(t.description||'').toLowerCase().includes(search.toLowerCase())||(t.invoiceRef||'').toLowerCase().includes(search.toLowerCase()));
  if (typeF) txns = txns.filter(t=>t.type===typeF);
  if (catF) txns = txns.filter(t=>t.category===catF);
  txns = txns.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <div class="section-header">
      <div><div class="section-title">Alle Buchungen</div><div class="section-sub">${yr}</div></div>
      <button class="btn btn-primary btn-sm" onclick="openTxModal()">+ Neue Buchung</button>
    </div>
    <div class="filters">
      <input type="text" placeholder="🔍 Suchen..." value="${esc(search)}" oninput="UI.render('transactions',{search:this.value,type:'${typeF}',cat:'${catF}'})">
      <select onchange="UI.render('transactions',{search:'${esc(search)}',type:this.value,cat:'${catF}'})">
        <option value="" ${!typeF?'selected':''}>Alle Typen</option>
        <option value="income" ${typeF==='income'?'selected':''}>Einnahmen</option>
        <option value="expense" ${typeF==='expense'?'selected':''}>Ausgaben</option>

// ── RECHNUNGEN ─────────────────────────────────────────────
Pages.invoices = function() {
  const s = State.get(); const yr = s.settings.accountingYear;
  const issued = s.invoicesIssued.filter(i=>i.issueDate&&i.issueDate.startsWith(String(yr)));

  return `
    <div class="section-header">
      <div><div class="section-title">Rechnungen</div><div class="section-sub">${yr}</div></div>

function invoiceTable(list, type) {

        ${i.status!=='paid'?`<button class="btn btn-ghost btn-sm" onclick="markInvoicePaid('${i.id}','${type}')">✓ Bezahlt</button>`:''}
        <button class="btn btn-ghost btn-icon btn-sm" onclick="deleteInvoice('${i.id}','${type}')" style="color:var(--red)" title="Löschen">✕</button>

function renderLineItemsEditor(lines) {
  const normalized = (lines && lines.length ? lines : [{ id: uid(), positionNumber: 1, description: '', quantity: 1, unit: (State.get().settings.invoice||defaultInvoiceSettings()).defaultUnit || 'h', unitPrice: 0, vatRate: 0 }]);

}
function openInvoiceModal(id, type) {
  const s = State.get(); const arr = type==='issued' ? s.invoicesIssued : s.invoicesReceived; const existing = id ? arr.find(i=>i.id===id) : null; const cfg = s.settings.invoice || defaultInvoiceSettings(); const cpType = type==='issued' ? 'customer' : 'supplier'; const invoiceNumber = existing?.number || (type==='issued' ? buildInvoiceNumber() : `EING-${String((s.invoicesReceived||[]).length+1).padStart(4,'0')}`); const issueDate = existing?.issueDate || dateStr(); const vatTreatment = existing?.vatTreatment || (type==='issued' ? 'eu_b2b_rc_income' : 'domestic_taxable_expense');
  const body = `<div class="form-row form-row-3"><div class="form-group"><label>Rechnungsnummer *</label><input type="text" id="if-num" value="${esc(invoiceNumber)}"></div><div class="form-group"><label>Geschäftspartner *</label><select id="if-cp" onchange="prefillInvoiceCounterparty()">${counterpartyOptions(cpType)}</select></div><div class="form-group"><label>Status</label><select id="if-status"><option value="draft" ${existing?.status==='draft'?'selected':''}>Entwurf</option><option value="unpaid" ${!existing || existing?.status==='unpaid'?'selected':''}>Offen</option><option value="paid" ${existing?.status==='paid'?'selected':''}>Bezahlt</option><option value="partial" ${existing?.status==='partial'?'selected':''}>Teilbezahlt</option><option value="cancelled" ${existing?.status==='cancelled'?'selected':''}>Storniert</option></select></div></div><div class="form-row form-row-3"><div class="form-group"><label>Ausstellungsdatum *</label><input type="date" id="if-issue" value="${issueDate}"></div><div class="form-group"><label>Fälligkeitsdatum *</label><input type="date" id="if-due" value="${existing?.dueDate || addDays(issueDate, cfg.dueDays || 15)}"></div><div class="form-group"><label>Ansprechpartner</label><input type="text" id="if-contact" value="${esc(existing?.contactPerson || '')}"></div></div><div class="form-row form-row-2"><div class="form-group"><label>Leistungszeitraum von</label><input type="date" id="if-spf" value="${existing?.servicePeriodFrom || issueDate}"></div><div class="form-group"><label>Leistungszeitraum bis</label><input type="date" id="if-spt" value="${existing?.servicePeriodTo || issueDate}"></div></div><div class="form-row form-row-2"><div class="form-group"><label>Steuerliche Einordnung</label><select id="if-vt">${vatTreatmentOptions(type==='issued' ? 'income' : 'expense')}</select></div><div class="form-group"><label>Währung</label><input type="text" id="if-currency" value="${esc(existing?.currency || s.settings.currency || 'EUR')}"></div></div><div class="form-group"><label>Einleitungstext</label><textarea id="if-intro">${esc(existing?.introText || cfg.standardIntroText || '')}</textarea></div><div class="form-group"><label>Zahlungsbedingungen</label><textarea id="if-payterms">${esc(existing?.paymentTermsText || cfg.standardPaymentTerms || '')}</textarea></div><div class="form-group"><label>Steuerhinweis</label><textarea id="if-taxnote">${esc(existing?.taxNoteText || (vatTreatment==='eu_b2b_rc_income' ? cfg.standardReverseChargeNote : cfg.standardVatNote || ''))}</textarea></div><div class="form-group"><label>Grußformel</label><textarea id="if-closing">${esc(existing?.closingText || cfg.standardClosingText || '')}</textarea></div><hr class="sep"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="card-title" style="margin-bottom:0">Positionen</div><button class="btn btn-ghost btn-sm" onclick="addInvoiceLine()">+ Position</button></div><div id="invoice-lines-editor">${renderLineItemsEditor(existing?.lineItems)}</div><div class="info-bar" id="invoice-totals-preview" style="margin-top:14px"></div><div class="form-group"><label>Interne Notiz</label><textarea id="if-note">${esc(existing?.internalNote || '')}</textarea></div>`;
  openModal(existing?'Rechnung bearbeiten':'Neue Rechnung', body, `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Abbrechen</button>${type==='issued' ? `<button class="btn btn-ghost btn-sm" onclick="previewInvoiceDraft(${id?`'${id}'`:'null'},'${type}')">Vorschau</button>` : ''}<button class="btn btn-primary btn-sm" onclick="saveInvoice(${id?`'${id}'`:'null'},'${type}')">Speichern</button>`, 'wide');
  setTimeout(()=>{ const cpEl=document.getElementById('if-cp'); if(cpEl) cpEl.value = existing?.counterpartyId || ''; document.getElementById('if-vt').value = vatTreatment; bindInvoiceEditorEvents(); updateInvoiceTotalsPreview(); }, 20);
}
window.openInvoiceModal = openInvoiceModal;
function bindInvoiceEditorEvents() { document.querySelectorAll('#invoice-lines-editor input, #invoice-lines-editor select, #invoice-lines-editor textarea, #if-vt').forEach(el => { el.oninput = () => { syncTaxNoteSuggestion(); updateInvoiceTotalsPreview(); }; el.onchange = () => { syncTaxNoteSuggestion(); updateInvoiceTotalsPreview(); }; }); }
function prefillInvoiceCounterparty() { const cp = getCounterpartyById(document.getElementById('if-cp')?.value || ''); if (!cp) return; const contact = document.getElementById('if-contact'); if (contact && !contact.value) contact.value = cp.contactPerson || ''; }
window.prefillInvoiceCounterparty = prefillInvoiceCounterparty;
function collectInvoiceLines() { return [...document.querySelectorAll('#invoice-lines-editor [data-line-row]')].map((row, idx) => { const get = name => row.querySelector(`[data-line-field="${name}"]`)?.value; return { id: row.dataset.lineId || uid(), positionNumber: parseInt(get('positionNumber') || idx + 1, 10), description: get('description') || '', quantity: parseFloat(get('quantity') || 0), unit: get('unit') || 'h', unitPrice: parseFloat(get('unitPrice') || 0), vatRate: parseFloat(get('vatRate') || 0), }; }).filter(line => line.description || line.quantity || line.unitPrice); }
function draftInvoiceFromForm(id, type) { const s = State.get(); const cp = getCounterpartyById(document.getElementById('if-cp').value || ''); return normalizeInvoice({ id: id || uid(), number: document.getElementById('if-num').value, invoiceNumber: document.getElementById('if-num').value, counterpartyId: document.getElementById('if-cp').value, issueDate: document.getElementById('if-issue').value, dueDate: document.getElementById('if-due').value, servicePeriodFrom: document.getElementById('if-spf').value, servicePeriodTo: document.getElementById('if-spt').value, contactPerson: document.getElementById('if-contact').value, status: document.getElementById('if-status').value, currency: document.getElementById('if-currency').value || s.settings.currency || 'EUR', vatTreatment: document.getElementById('if-vt').value, introText: document.getElementById('if-intro').value, paymentTermsText: document.getElementById('if-payterms').value, taxNoteText: document.getElementById('if-taxnote').value, closingText: document.getElementById('if-closing').value, internalNote: document.getElementById('if-note').value, lineItems: collectInvoiceLines(), recipientSnapshot: cp ? { customerName: cp.name || '', addressLine1: cp.address || '', addressLine2: cp.address2 || '', zip: cp.zip || '', city: cp.city || '', country: cp.country || '', vatId: cp.vatNumber || '', contactPerson: document.getElementById('if-contact').value || cp.contactPerson || '', } : undefined, reverseCharge: document.getElementById('if-vt').value === 'eu_b2b_rc_income', vatExempt: document.getElementById('if-vt').value === 'vat_exempt', updatedAt: now() }, type); }
function updateInvoiceTotalsPreview() { const box = document.getElementById('invoice-totals-preview'); if (!box) return; const inv = draftInvoiceFromForm(null, window._invoiceTab || 'issued'); box.innerHTML = `<strong>Summen:</strong> Netto ${fmtMoney(inv.subtotalNet)} · USt. ${fmtMoney(inv.totalVat)} · Gesamt ${fmtMoney(inv.totalGross)} <span class="muted">· ${esc(invoiceTaxLabel(inv))}</span>`; }
function syncTaxNoteSuggestion() { const vatTreatment = document.getElementById('if-vt')?.value; const field = document.getElementById('if-taxnote'); const cfg = State.get().settings.invoice || defaultInvoiceSettings(); if (!field) return; if (vatTreatment === 'eu_b2b_rc_income' && (!field.value || field.dataset.auto === 'true')) { field.value = cfg.standardReverseChargeNote || ''; field.dataset.auto = 'true'; } else if (vatTreatment !== 'eu_b2b_rc_income' && (!field.value || field.dataset.auto === 'true')) { field.value = cfg.standardVatNote || ''; field.dataset.auto = 'true'; } }
window.addInvoiceLine = function() { const c=document.getElementById('invoice-lines-editor'); const lines=collectInvoiceLines(); lines.push({ id: uid(), positionNumber: lines.length + 1, description: '', quantity: 1, unit: (State.get().settings.invoice||defaultInvoiceSettings()).defaultUnit || 'h', unitPrice: 0, vatRate: 0 }); c.innerHTML = renderLineItemsEditor(lines); bindInvoiceEditorEvents(); updateInvoiceTotalsPreview(); };
window.removeInvoiceLine = function(idx) { const c=document.getElementById('invoice-lines-editor'); const lines=collectInvoiceLines(); lines.splice(idx,1); c.innerHTML = renderLineItemsEditor(lines.length ? lines : null); bindInvoiceEditorEvents(); updateInvoiceTotalsPreview(); };
window.previewInvoiceDraft = function(id, type) { const inv = draftInvoiceFromForm(id, type); const errors = Validate.invoice(inv); if (errors.length) { showToast(errors[0], 'error'); return; } openModal(`Rechnung ${inv.number} – Vorschau`, generateInvoiceDocument(inv), `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Schließen</button>`, 'wide'); };
window.saveInvoice = function(id, type) { const inv = draftInvoiceFromForm(id, type); const errors = Validate.invoice(inv); if (errors.length) { showToast(errors[0], 'error'); return; } State.set(s=>{ const arr = type==='issued' ? s.invoicesIssued : s.invoicesReceived; const idx = arr.findIndex(i=>i.id===id); const prev = idx >= 0 ? arr[idx] : null; inv.createdAt = prev?.createdAt || inv.createdAt || now(); inv.updatedAt = now(); inv.documentMeta.updatedAt = now(); if (idx>=0) arr[idx]=inv; else arr.push(inv); if (type === 'issued') { if (idx < 0 && s.settings.invoice) s.settings.invoice.nextNumber = (s.settings.invoice.nextNumber || 1) + 1; const txData = { id: prev?.linkedTransactionId || inv.linkedTransactionId || uid(), date: inv.issueDate, type: 'income', category: 'Softwareentwicklung', description: (inv.lineItems[0]?.description || `Rechnung ${inv.number}`).slice(0, 200), counterpartyId: inv.counterpartyId, netAmount: inv.subtotalNet, vatRate: inv.subtotalNet ? (inv.totalVat / inv.subtotalNet) : 0, vatAmount: inv.totalVat, grossAmount: inv.totalGross, vatTreatment: inv.vatTreatment, paymentStatus: inv.status === 'paid' ? 'paid' : 'unpaid', invoiceRef: inv.number, createdAt: prev?.createdAt || now(), updatedAt: now(), deductible: true, currency: inv.currency || 'EUR' }; const txIdx = s.transactions.findIndex(t => t.id === txData.id || t.invoiceRef === inv.number); if (txIdx >= 0) s.transactions[txIdx] = { ...s.transactions[txIdx], ...txData }; else s.transactions.push(txData); inv.linkedTransactionId = txData.id; if (idx>=0) arr[idx]=inv; else arr[arr.length-1]=inv; } }); closeModal(); showToast('Rechnung gespeichert','success'); UI.render('invoices'); };
window.markInvoicePaid = function(id, type) { State.set(s=>{ const arr = type==='issued' ? s.invoicesIssued : s.invoicesReceived; const inv = arr.find(i=>i.id===id); if(inv) { inv.status='paid'; inv.updatedAt = now(); if (type==='issued' && inv.linkedTransactionId) { const tx = s.transactions.find(t=>t.id===inv.linkedTransactionId || t.invoiceRef===inv.number); if (tx) tx.paymentStatus = 'paid'; } } }); showToast('Rechnung als bezahlt markiert','success'); UI.render('invoices'); };
window.deleteInvoice = function(id, type) { confirm('Rechnung löschen?', ()=>{ State.set(s=>{ const arr = type==='issued' ? s.invoicesIssued : s.invoicesReceived; const inv = arr.find(i=>i.id===id); if (type==='issued' && inv?.linkedTransactionId) s.transactions = s.transactions.filter(t=>t.id!==inv.linkedTransactionId); if(type==='issued') s.invoicesIssued=s.invoicesIssued.filter(i=>i.id!==id); else s.invoicesReceived=s.invoicesReceived.filter(i=>i.id!==id); }); showToast('Rechnung gelöscht','warn'); UI.render('invoices'); }); };

window.openDividendModal = openDividendModal;
window.calcDividend = function() {
  const gross = parseFloat(document.getElementById('d-gross')?.value)||0;
  const whtPct = parseFloat(document.getElementById('d-wht')?.value)||0;
  const wht = Math.round(gross * whtPct/100 * 100)/100;
  const netEl = document.getElementById('d-net'); if(netEl) netEl.value=(gross-wht).toFixed(2);
};
window.saveDividend = function() {
  const gross = parseFloat(document.getElementById('d-gross').value)||0;
  const whtPct = parseFloat(document.getElementById('d-wht').value)||0;
  const whtAmt = Math.round(gross*whtPct/100*100)/100;
  if (!gross||gross<=0) { showToast('Bitte gültigen Betrag eingeben','error'); return; }
  State.set(s=>s.dividends.push({
    id: uid(), profitYear: parseInt(document.getElementById('d-yr').value),
    resolutionDate: document.getElementById('d-res').value,
    paymentDate: document.getElementById('d-pay').value,
    grossDividend: gross, whtRate: whtPct/100, whtAmount: whtAmt,
    netPayout: gross-whtAmt, shareholderNote: document.getElementById('d-note').value,
    createdAt: now(), updatedAt: now(),
  }));
  closeModal(); showToast('Dividende gespeichert','success'); UI.render('dividends');
};
window.deleteDividend = function(id) {
  confirm('Dividendeneintrag löschen?',()=>{ State.set(s=>{s.dividends=s.dividends.filter(d=>d.id!==id);}); showToast('Gelöscht','warn'); UI.render('dividends'); });
};

Pages.reports = function() {
  const s = State.get(); const yr = s.settings.accountingYear;
  const txns = s.transactions.filter(t=>t.date&&t.date.startsWith(String(yr)));
  const byCustomer = {};
  txns.filter(t=>t.type==='income').forEach(t=>{
    const k = t.counterpartyId||'_none';
    byCustomer[k] = (byCustomer[k]||0) + (t.netAmount||0);
  });
  const byCat = {};
  txns.filter(t=>t.type==='expense').forEach(t=>{
    const k = t.category||'Sonstiges';
    byCat[k] = (byCat[k]||0) + (t.grossAmount||0);
  });
  const monthly = {};
  for (let m=1;m<=12;m++) { monthly[m]={income:0,expense:0}; }
  txns.forEach(t=>{
    const m = parseInt(t.date.slice(5,7));
    if (t.type==='income') monthly[m].income += (t.netAmount||0);
    else monthly[m].expense += (t.grossAmount||0);
  });
  const monthNames=['','Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return `
    <div class="section-header">
      <div><div class="section-title">Berichte</div><div class="section-sub">${yr}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ CSV Buchungen</button>
        <button class="btn btn-ghost btn-sm" onclick="exportTaxCSV()">⬇ CSV Steuerübersicht</button>
      </div>
    </div>
    <div class="grid grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">Monatliche Übersicht</div>
        <div class="table-wrap" style="margin-top:8px">
          <table>
            <thead><tr><th>Monat</th><th class="text-right">Einnahmen</th><th class="text-right">Ausgaben</th><th class="text-right">Gewinn</th></tr></thead>
            <tbody>
            ${Object.entries(monthly).map(([m,v])=>{
              const profit=v.income-v.expense;
              return `<tr><td>${monthNames[parseInt(m)]}</td><td class="text-right mono green">${fmtMoney(v.income)}</td><td class="text-right mono red">${fmtMoney(v.expense)}</td><td class="text-right mono ${profit>=0?'green':'red'}">${fmtMoney(profit)}</td></tr>`;
            }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Einnahmen nach Kunde</div>
        <div class="table-wrap" style="margin-top:8px">
          <table>
            <thead><tr><th>Partner</th><th class="text-right">Betrag</th></tr></thead>
            <tbody>
            ${Object.entries(byCustomer).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(cpName(k==='_none'?null:k))}</td><td class="text-right mono green">${fmtMoney(v)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Ausgaben nach Kategorie</div>
      <div class="table-wrap" style="margin-top:8px">
        <table>
          <thead><tr><th>Kategorie</th><th class="text-right">Betrag</th><th>Anteil</th></tr></thead>
          <tbody>
          ${(()=>{
            const total = Object.values(byCat).reduce((a,v)=>a+v,0)||1;
            return Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr>
              <td>${esc(k)}</td>
              <td class="text-right mono red">${fmtMoney(v)}</td>
              <td><div style="display:flex;align-items:center;gap:8px"><div style="width:80px;height:6px;background:var(--border);border-radius:3px"><div style="width:${Math.round(v/total*100)}%;height:6px;background:var(--red);border-radius:3px"></div></div>${(v/total*100).toFixed(1)}%</div></td>
            </tr>`).join('');
          })()}
          </tbody>
        </table>
      </div>
    </div>`;
};
